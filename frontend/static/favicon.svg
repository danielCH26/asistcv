<!--
  eptus — favicon. Version simplificada de la marca: el tile indigo es el
  marco y la pieza es el circulo blanco en la esquina. A 16 px el marco y la
  pieza se embarrerian, asi que el favicon solo lleva la pieza.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<rect width="32" height="32" rx="7" fill="#4f46e5" />
	<circle cx="21.5" cy="10.5" r="5.6" fill="#ffffff" />
</svg>
