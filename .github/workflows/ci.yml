name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 + UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint backend
        run: |
          cd backend
          uv sync --all-extras
          uv run ruff check .

      - name: Lint mcp-adapter
        run: |
          cd mcp-adapter
          uv sync --all-extras
          uv run ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 + UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Typecheck backend
        run: |
          cd backend
          uv sync --all-extras
          uv run mypy app/

      - name: Typecheck mcp-adapter
        run: |
          cd mcp-adapter
          uv sync --all-extras
          uv run mypy src/

  test-backend:
    name: Tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asistcv_test
          POSTGRES_PASSWORD: asistcv_test
          POSTGRES_DB: asistcv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asistcv_test -d asistcv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://asistcv_test:asistcv_test@localhost:5432/asistcv_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 + UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Run migrations
        run: cd backend && uv run alembic upgrade head

      - name: Run tests
        run: cd backend && uv run pytest --cov=app --cov-report=term

  test-mcp:
    name: Tests (mcp-adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 + UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: cd mcp-adapter && uv sync --all-extras

      - name: Run tests
        run: cd mcp-adapter && uv run pytest

  docker-build:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend image
        if: steps.check.outputs.exists == 'true'
        run: docker build -t asistcv-backend:ci ./backend

  frontend-i18n-parity:
    name: Frontend i18n parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check i18n key parity (es ↔ en)
        run: node scripts/check-i18n-keys.mjs
        working-directory: frontend
