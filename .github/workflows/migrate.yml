name: Migrate database

# Aplica las migraciones de Alembic contra la base de producción (Neon).
#
# Antes esto era un paso manual: Render despliega el código pero nunca
# corría `alembic upgrade head`, así que la base podía quedar por detrás
# del código (por ejemplo, el CHECK de `payment_methods.provider` que
# rechazaba los eventos de Wompi con un 500 en el webhook).
#
# Necesita el secreto `DATABASE_URL` en Settings → Secrets → Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 + UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Check the secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            # Aviso, no fallo: un push no debería quedar en rojo por una
            # variable de despliegue que no vive en el repo. La migración
            # queda pendiente y hay que aplicarla a mano (docs/DEPLOY.md §3).
            echo "::warning::falta el secreto DATABASE_URL — las migraciones NO se aplicaron. Agregalo en Settings → Secrets and variables → Actions, o corré 'alembic upgrade head' a mano."
            echo "DATABASE_URL_MISSING=1" >> "$GITHUB_ENV"
          fi

      - name: Apply migrations
        if: env.DATABASE_URL_MISSING != '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd backend && uv run alembic upgrade head

      - name: Show the applied revision
        if: env.DATABASE_URL_MISSING != '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd backend && uv run alembic current
