services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistcv-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: asistcv
      POSTGRES_PASSWORD: asistcv
      POSTGRES_DB: asistcv
    volumes:
      - asistcv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistcv -d asistcv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  asistcv_pgdata:
