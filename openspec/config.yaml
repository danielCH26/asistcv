# AsistCV — OpenSpec Configuration

## Context

Job-search-assistant agéntico. Producto: asistente de búsqueda de empleo con 3 capacidades:
1. Match JD↔perfil
2. Adaptar CV + outreach + brief empresa  
3. Tracking pipeline

## Stack

- **Frontend**: SvelteKit (adapter-static) → Cloudflare Pages
- **Backend**: FastAPI (Python 3.12) → Render
- **DB**: Postgres + pgvector → Neon
- **LLM**: Groq (`qwen/qwen3.8-27b`, `max_tokens=800`)
- **Embeddings**: HuggingFace Inference (`BAAI/bge-m3`, 1024 dim)
- **CI/CD**: GitHub Actions
- **Secrets**: Render env vars + GitHub Actions secrets

## Strict TDD

**Status**: false

**Reason**: Proyecto greenfield sin código. Testing capabilities se definirán en fase design cuando se configure el proyecto Python/SvelteKit.

