## Phase Rules

- **propose**: Crear proposal con alcance MVP y anti-patrones definidos
- **spec**: Especificar las 3 capacidades con escenarios
- **design**: Definir arquitectura técnica y modelo de datos
- **tasks**: Dividir en slices implementables
- **apply**: Implementar por tasks
- **verify**: Tests manuales + validación contra spec
- **archive**: Sync specs a main

